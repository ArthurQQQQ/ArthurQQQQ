<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="220" viewBox="0 0 1000 220" role="img" aria-labelledby="title description">
  <title id="title">Jiayi (Arthur) Qiu</title>
  <desc id="description">A deep navy research banner about memory and evidence in language agents. Three connected steps show experience, memory, and evidence.</desc>
  <defs>
    <linearGradient id="ground" x2="1" y2="1">
      <stop stop-color="#18283b"/>
      <stop offset="1" stop-color="#0c1727"/>
    </linearGradient>
    <pattern id="dot-grid" width="14" height="14" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="0.8" fill="#42627e"/>
    </pattern>
    <marker id="arrow-blue" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <path d="M1 1L6 3.5L1 6" fill="none" stroke="#9fcaff" stroke-width="1.25"/>
    </marker>
    <marker id="arrow-teal" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <path d="M1 1L6 3.5L1 6" fill="none" stroke="#79dcc9" stroke-width="1.25"/>
    </marker>
    <clipPath id="diagram">
      <rect x="522" y="35" width="442" height="150" rx="11"/>
    </clipPath>
  </defs>

  <rect x="0.75" y="0.75" width="998.5" height="218.5" rx="13" fill="url(#ground)" stroke="#3e5a77" stroke-width="1.5"/>
  <path d="M38 56H77" stroke="#9fcaff" stroke-width="2.5"/>
  <text x="36" y="117" fill="#eff6fc" font-family="Georgia, 'Times New Roman', serif" font-size="55" letter-spacing="-1.6">Jiayi (Arthur) Qiu</text>
  <text x="39" y="154" fill="#b2c7dc" font-family="system-ui, sans-serif" font-size="19">Memory and evidence in language agents</text>

  <rect x="522" y="35" width="442" height="150" rx="11" fill="#101f32" stroke="#3e5a77"/>
  <rect x="522" y="35" width="442" height="150" fill="url(#dot-grid)" opacity=".54" clip-path="url(#diagram)"/>

  <path d="M646 110H682" fill="none" stroke="#9fcaff" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
  <path d="M794 110H830" fill="none" stroke="#79dcc9" stroke-width="1.5" marker-end="url(#arrow-teal)"/>
  <rect x="542" y="71" width="104" height="78" rx="8" fill="#1a3049" stroke="#5c81a5"/>
  <rect x="690" y="71" width="104" height="78" rx="8" fill="#1a3049" stroke="#5c81a5"/>
  <rect x="838" y="71" width="104" height="78" rx="8" fill="#153832" stroke="#66a698"/>

  <g fill="none" stroke="#9fcaff" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round">
    <path d="M589 91h9l6 6v17h-20V91h5m9 0v6h6m-15 5h10m-10 5h7"/>
    <ellipse cx="742" cy="94" rx="11" ry="3.7"/>
    <path d="M731 94v16c0 2 4.9 3.7 11 3.7s11-1.7 11-3.7V94m-22 8c0 2 4.9 3.7 11 3.7s11-1.7 11-3.7"/>
  </g>
  <g fill="none" stroke="#79dcc9" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="890" cy="103" r="11"/>
    <path d="m885 103 3.2 3.25 6.4-6.5"/>
  </g>

  <g font-family="system-ui, sans-serif" font-size="15" font-weight="620" text-anchor="middle">
    <text x="594" y="135" fill="#e0edff">Experience</text>
    <text x="742" y="135" fill="#e0edff">Memory</text>
    <text x="890" y="135" fill="#bcf1e7">Evidence</text>
  </g>
</svg>
